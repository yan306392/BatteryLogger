name: Build APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download and Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/BatteryLogger-v1.0.${{ github.run_number }}.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLogger-v1.0.${{ github.run_number }}
          path: output/BatteryLogger-v1.0.${{ github.run_number }}.apk
